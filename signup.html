<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Website App/Sign Up</title>
  </head>
  <body>
    <h1>Sign Up</h1>

    <form>
      First Name: <input type="text" name="first_name" required /><br /><br />
      Surname: <input type="text" name="surname" required /><br /><br />
      Username: <input type="username" name="username" required /><br /><br />
      Email: <input type="email" name="email" required /><br /><br />
      Password: <input type="password" name="password" required /><br /><br />
      Password Verification: <input type="password" name="verify_password" required /><br /><br />
      <input type="submit" value="Sign Up" />
    </form>
  </body>
</html>
