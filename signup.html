<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Website App/Sign Up</title>
  </head>

  <body>
    <div class="login-container">
      <h1>Create an Account</h1>
      <p>Please enter your details to sign up.</p>

      <form id="signupForm">
        <div class="name-row">
          <div>
            <label for="first_name">First Name:</label>
            <input
              type="text"
              id="first_name"
              name="first_name"
              placeholder="Enter first name"
              required
            />
          </div>

          <div>
            <label for="surname">Surname:</label>
            <input
              type="text"
              id="surname"
              name="surname"
              placeholder="Enter surname"
              required
            />
          </div>
        </div>

        <label for="username">Username:</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter username"
          required
        />

        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter email"
          required
        />

        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter password"
          required
        />
        <label for="verify_password">Confirm Password:</label>
        <input
          type="password"
          id="verify_password"
          name="verify_password"
          placeholder="Confirm password"
          required
        />
        <button type="button" id="togglePassword">Show Password</button>

        <div id="passwordRequirements">
          <p id="length">✗ At least 8 characters</p>
          <p id="uppercase">✗ At least 1 uppercase letter</p>
          <p id="special">✗ At least 1 special character</p>
          <p id="match">✗ Passwords match</p>
        </div>
        <button type="submit">Sign Up</button>
      </form>

      <p>
        Already have an account?
        <a href="login.html">Login</a>
      </p>
    </div>
    <div id="successPopup" class="popup">
      <div class="popup-content">
        <img src="tick.gif" alt="Success" class="success-gif" />

        <h2>Successfully Signed Up!</h2>
        <p>Please check your email to verify your account.</p>
        <button type="button" id="continueLogin">Continue to Login</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
